name: Deploy Minha Fila

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-minha-fila
  cancel-in-progress: true

jobs:
  # Roda no mesmo runner do deploy (a VPS de produção): nada de PHP no host e
  # nenhuma porta publicada — o Postgres de teste vive numa rede docker por
  # `run_id`, longe do 5432 de produção e de outra execução em paralelo.
  test:
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Subir Postgres efêmero
        run: |
          NET="mf-ci-${{ github.run_id }}"
          docker network create "$NET"
          docker run -d --name "mf-ci-pg-${{ github.run_id }}" --network "$NET" --network-alias ci-pg \
            -e POSTGRES_USER=minhafila \
            -e POSTGRES_PASSWORD=minhafila_testing \
            -e POSTGRES_DB=testing \
            postgres:17
          for i in $(seq 1 30); do
            docker exec "mf-ci-pg-${{ github.run_id }}" pg_isready -U minhafila >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres não subiu a tempo" >&2
          exit 1

      - name: Install dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.3 \
            composer install --no-interaction --prefer-dist --no-scripts

      - name: Prepare .env for testing
        run: |
          cd backend
          cp .env.example .env
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|DB_HOST=.*|DB_HOST=ci-pg|' .env
          sed -i 's|DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=minhafila|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=minhafila_testing|' .env
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.3 \
            sh -c 'php artisan key:generate && php artisan package:discover --ansi'

      - name: Run tests
        run: |
          docker run --rm \
            --network "mf-ci-${{ github.run_id }}" \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=ci-pg \
            -e DB_PORT=5432 \
            -e DB_DATABASE=testing \
            -e DB_USERNAME=minhafila \
            -e DB_PASSWORD=minhafila_testing \
            -e CACHE_DRIVER=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            -e TELESCOPE_ENABLED=false \
            arthurlehdermann/alpine-nginx-php8.3 \
            vendor/bin/phpunit

      - name: Teardown Postgres efêmero
        if: always()
        run: |
          docker rm -f "mf-ci-pg-${{ github.run_id }}" 2>/dev/null || true
          docker network rm "mf-ci-${{ github.run_id }}" 2>/dev/null || true

  deploy:
    needs: [test]
    runs-on: [self-hosted, minha-fila-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -euo pipefail
          PROJECT=minha-fila
          PROD=/root/${PROJECT}
          BUILD=/root/${PROJECT}-build
          OLD=/tmp/${PROJECT}-old-$$
          ENV_FILE=/root/minha-fila-secrets/.env.prod
          MAINT=minha_fila_maintenance
          SWAPPED=0

          test -f "$ENV_FILE"

          cleanup() {
            if [ "$SWAPPED" = "0" ]; then
              rm -rf "$BUILD" 2>/dev/null || true
            fi
            docker rm -f "$MAINT" 2>/dev/null || true
          }
          trap cleanup EXIT

          DC() { docker compose -p "$PROJECT" --env-file "$ENV_FILE" -f "$1/docker-compose.yml" "${@:2}"; }

          echo "📦 Prepare em path paralelo (prod ainda no ar)..."
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          rsync -a --delete \
            --exclude '/.git' --exclude '/node_modules' --exclude '/frontend/node_modules' \
            --exclude '/backend/node_modules' --exclude '/backend/vendor' --exclude '/vendor' \
            "$GITHUB_WORKSPACE"/ "$BUILD"/

          if [ -f "$BUILD/backend/package.json" ]; then
            echo "🧩 Vite backend..."
            docker run --rm -v "$BUILD/backend":/app -w /app node:20-alpine \
              sh -c "npm ci && npm run build" || \
            docker run --rm -v "$BUILD/backend":/app -w /app node:20-alpine \
              sh -c "npm install && npm run build"
          fi

          if [ -f "$BUILD/frontend/package.json" ]; then
            echo "🧩 Frontend assets..."
            docker run --rm -v "$BUILD/frontend":/app -w /app node:20-alpine \
              sh -c "npm ci && npm run build" || \
            docker run --rm -v "$BUILD/frontend":/app -w /app node:20-alpine \
              sh -c "npm install && npm run build"
          fi

          echo "📦 Composer no build path..."
          docker run --rm \
            -v "$BUILD/backend":/var/www/html \
            -w /var/www/html \
            arthurlehdermann/alpine-nginx-php8.3 \
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

          echo "🐳 docker build (imagens novas; containers antigos seguem)..."
          DC "$BUILD" build

          echo "⏸️ Maintenance (janela curta)..."
          DC "$PROD" --profile maintenance up -d maintenance

          echo "🔄 Cutover..."
          DC "$PROD" stop || true
          rm -rf "$OLD"
          mv "$PROD" "$OLD"
          mv "$BUILD" "$PROD"
          SWAPPED=1

          cp "$ENV_FILE" "$PROD/.env"
          if [ -d "$OLD/backend/storage" ]; then
            rm -rf "$PROD/backend/storage"
            cp -a "$OLD/backend/storage" "$PROD/backend/storage"
          elif [ -d "$OLD/storage" ]; then
            rm -rf "$PROD/storage"
            cp -a "$OLD/storage" "$PROD/storage"
          fi

          echo "🚀 Up (sem rebuild/composer)..."
          DC "$PROD" up -d --remove-orphans

          DC "$PROD" exec -T app php artisan migrate --force
          DC "$PROD" exec -T app php artisan optimize || true
          DC "$PROD" exec -T app php artisan queue:restart || true

          echo "✅ Tirando maintenance..."
          DC "$PROD" --profile maintenance rm -f maintenance 2>/dev/null || true
          docker rm -f "$MAINT" 2>/dev/null || true
          trap - EXIT

          echo "🧹 Limpeza..."
          rm -rf "$OLD" /root/${PROJECT}-build /tmp/${PROJECT}-old-* 2>/dev/null || true
          docker image prune -f >/dev/null 2>&1 || true
          echo "✅ Deploy OK $(date -Is)"

      - name: Troubleshooting
        if: failure()
        run: |
          docker compose -p minha-fila --env-file /root/minha-fila-secrets/.env.prod ps || true
          docker logs minha_fila_app --tail 100 || true
