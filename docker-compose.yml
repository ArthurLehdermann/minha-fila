networks:
  minhafila_internal: # Banco, cache, serviços internos
    driver: bridge
  traefik: # Traefik compartilhado
    external: true

volumes:
  redis_data:

services:
  # PostgreSQL local removido (2026-08-11): DB em pgsql.vps.bigworks.com.br

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: minha_fila_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - minhafila_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Laravel App (Nginx + PHP) ────────────────────────────────────────────
  app:
    image: arthurlehdermann/alpine-nginx-php8.3
    container_name: minha_fila_app
    restart: always
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    networks:
      - traefik
      - minhafila_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-app.rule=Host(`minhafila.meugarcom.app`) && (PathPrefix(`/api`) || PathPrefix(`/auth/google`) || PathPrefix(`/auth/magic-link`) || PathPrefix(`/sanctum`) || PathPrefix(`/storage`))"
      - "traefik.http.routers.minhafila-app.entrypoints=websecure"
      - "traefik.http.routers.minhafila-app.tls=true"
      - "traefik.http.routers.minhafila-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-app.loadbalancer.server.port=80"
      - "traefik.http.routers.minhafila-app.priority=300"

      - "traefik.http.middlewares.minhafila-hyphen-redirect.redirectregex.regex=^https://minha-fila\\.meugarcom\\.app(.*)"
      - "traefik.http.middlewares.minhafila-hyphen-redirect.redirectregex.replacement=https://minhafila.meugarcom.app$${1}"
      - "traefik.http.middlewares.minhafila-hyphen-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.minhafila-app-legacy.rule=Host(`minha-fila.meugarcom.app`) && (PathPrefix(`/api`) || PathPrefix(`/auth/google`) || PathPrefix(`/auth/magic-link`) || PathPrefix(`/sanctum`) || PathPrefix(`/storage`))"
      - "traefik.http.routers.minhafila-app-legacy.entrypoints=websecure"
      - "traefik.http.routers.minhafila-app-legacy.tls=true"
      - "traefik.http.routers.minhafila-app-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minhafila-app-legacy.middlewares=minhafila-hyphen-redirect"
      - "traefik.http.routers.minhafila-app-legacy.priority=300"
      - "traefik.http.routers.minhafila-app-legacy.service=minhafila-app"
      - "traefik.docker.network=traefik"

  # ─── Queue worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minha_fila_queue
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "until [ -f /var/www/vendor/autoload.php ]; do echo '⏳ Aguardando dependências do backend...'; sleep 2; done; php /var/www/artisan queue:work --verbose --tries=3 --timeout=600"
    depends_on:
      - redis
    networks:
      - minhafila_internal

  # ─── Scheduler (artisan schedule:run) ─────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minha_fila_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "until [ -f /var/www/vendor/autoload.php ]; do echo '⏳ Aguardando dependências do backend...'; sleep 2; done; while true; do php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - redis
    networks:
      - minhafila_internal

  # ─── Soketi (realtime) ─────────────────────────────────────────────────────
  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: minha_fila_soketi
    restart: always
    env_file:
      - .env
    environment:
      SOKETI_REDIS_HOST: redis
      SOKETI_REDIS_PORT: 6379
      SOKETI_DEFAULT_APP_NAME: minha-fila
      SOKETI_DEFAULT_APP_ID: "2086410"
      SOKETI_DEFAULT_APP_KEY: "c31d1eb67de93c50e8ea"
      SOKETI_DEFAULT_APP_SECRET: "f7c319d8d0457ad709d2"
      SOKETI_LOG_LEVEL: info
      NODE_OPTIONS: --no-warnings
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-soketi.rule=(Host(`minhafila.meugarcom.app`) || Host(`minha-fila.meugarcom.app`)) && PathPrefix(`/app`)"
      - "traefik.http.routers.minhafila-soketi.entrypoints=websecure"
      - "traefik.http.routers.minhafila-soketi.tls=true"
      - "traefik.http.routers.minhafila-soketi.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-soketi.loadbalancer.server.port=6001"
      - "traefik.http.routers.minhafila-soketi.priority=350"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - minhafila_internal

  # ─── Frontend Next.js ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://minhafila.meugarcom.app
    container_name: minha_fila_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://minhafila.meugarcom.app
      NEXT_PUBLIC_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      NEXT_PUBLIC_PUSHER_HOST: minhafila.meugarcom.app
      NEXT_PUBLIC_PUSHER_PORT: "443"
      NEXT_PUBLIC_PUSHER_SCHEME: https
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-frontend.rule=Host(`minhafila.meugarcom.app`) && !PathPrefix(`/api`) && !PathPrefix(`/auth/google`) && !PathPrefix(`/auth/magic-link`) && !PathPrefix(`/sanctum`) && !PathPrefix(`/storage`) && !PathPrefix(`/app`)"
      - "traefik.http.routers.minhafila-frontend.entrypoints=websecure"
      - "traefik.http.routers.minhafila-frontend.tls=true"
      - "traefik.http.routers.minhafila-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.minhafila-frontend.priority=250"

      - "traefik.http.routers.minhafila-frontend-legacy.rule=Host(`minha-fila.meugarcom.app`) && !PathPrefix(`/api`) && !PathPrefix(`/auth/google`) && !PathPrefix(`/auth/magic-link`) && !PathPrefix(`/sanctum`) && !PathPrefix(`/storage`) && !PathPrefix(`/app`)"
      - "traefik.http.routers.minhafila-frontend-legacy.entrypoints=websecure"
      - "traefik.http.routers.minhafila-frontend-legacy.tls=true"
      - "traefik.http.routers.minhafila-frontend-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minhafila-frontend-legacy.middlewares=minhafila-hyphen-redirect"
      - "traefik.http.routers.minhafila-frontend-legacy.priority=250"
      - "traefik.http.routers.minhafila-frontend-legacy.service=minhafila-frontend"
      - "traefik.docker.network=traefik"
    networks:
      - traefik

  # Swagger UI removido (2026-08-11)

  # Acesso via SSH tunnel: ssh -L 8080:localhost:8080 user@servidor
  # depois abrir http://localhost:8080 localmente
  # swagger:  # desligado 2026-08-11 (PO) — não sobe em PRD
  #   image: swaggerapi/swagger-ui:latest
  #   container_name: minha_fila_swagger
  #   environment:
  #     SWAGGER_JSON: /spec/openapi.yaml
  #   volumes:
  #     - ./docs/openapi:/spec:ro
  #   networks:
  #     - minhafila_internal

  # ─── Maintenance page (sobe durante deploy) ───────────────────────────────
  maintenance:
    image: nginx:alpine
    container_name: minha_fila_maintenance
    restart: "no"
    profiles: ["maintenance"]
    volumes:
      - ./infra/maintenance:/usr/share/nginx/html:ro
      - ./infra/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-maintenance.rule=Host(`minhafila.meugarcom.app`) || Host(`minha-fila.meugarcom.app`)"
      - "traefik.http.routers.minhafila-maintenance.entrypoints=websecure"
      - "traefik.http.routers.minhafila-maintenance.tls=true"
      - "traefik.http.routers.minhafila-maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-maintenance.loadbalancer.server.port=80"
      - "traefik.http.routers.minhafila-maintenance.priority=1000"
