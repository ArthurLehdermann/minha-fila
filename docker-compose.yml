networks:
  minhafila_internal: # Banco, cache, serviços internos
    driver: bridge
  traefik_public: # Traefik compartilhado
    external: true

volumes:
  postgres_data:
  redis_data:

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: minhafila_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minhafila_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: minhafila_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - minhafila_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Laravel App (Nginx + PHP) ────────────────────────────────────────────
  app:
    image: arthurlehdermann/alpine-nginx-php8.3
    container_name: minhafila_app
    restart: always
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    networks:
      - traefik_public
      - minhafila_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-app.rule=(Host(`minha-fila.meugarcom.app`) || Host(`minhafila.meugarcom.app`)) && (PathPrefix(`/api`) || PathPrefix(`/auth/google`) || PathPrefix(`/auth/magic-link`) || PathPrefix(`/sanctum`) || PathPrefix(`/storage`))"
      - "traefik.http.routers.minhafila-app.entrypoints=websecure"
      - "traefik.http.routers.minhafila-app.tls=true"
      - "traefik.http.routers.minhafila-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-app.loadbalancer.server.port=80"
      - "traefik.http.routers.minhafila-app.priority=300"
      - "traefik.docker.network=traefik_public"

  # ─── Queue worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minhafila_queue
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "[ -f /var/www/vendor/autoload.php ] || composer install --no-interaction --prefer-dist --optimize-autoloader && php /var/www/artisan queue:work --verbose --tries=3 --timeout=600"
    depends_on:
      - db
      - redis
    networks:
      - minhafila_internal

  # ─── Scheduler (artisan schedule:run) ─────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minhafila_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "[ -f /var/www/vendor/autoload.php ] || composer install --no-interaction --prefer-dist --optimize-autoloader; while true; do php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - db
      - redis
    networks:
      - minhafila_internal

  # ─── Node build (assets) ───────────────────────────────────────────────────
  node:
    image: node:18
    container_name: minhafila_node
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "npm ci && npm run build"
    networks:
      - minhafila_internal

  # ─── Soketi (realtime) ─────────────────────────────────────────────────────
  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: minhafila_soketi
    restart: always
    env_file:
      - .env
    environment:
      SOKETI_REDIS_HOST: redis
      SOKETI_REDIS_PORT: 6379
      SOKETI_DEFAULT_APP_NAME: minha-fila
      SOKETI_DEFAULT_APP_ID: "2086410"
      SOKETI_DEFAULT_APP_KEY: "c31d1eb67de93c50e8ea"
      SOKETI_DEFAULT_APP_SECRET: "f7c319d8d0457ad709d2"
      SOKETI_LOG_LEVEL: info
      NODE_OPTIONS: --no-warnings
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-soketi.rule=(Host(`minha-fila.meugarcom.app`) || Host(`minhafila.meugarcom.app`)) && PathPrefix(`/app`)"
      - "traefik.http.routers.minhafila-soketi.entrypoints=websecure"
      - "traefik.http.routers.minhafila-soketi.tls=true"
      - "traefik.http.routers.minhafila-soketi.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-soketi.loadbalancer.server.port=6001"
      - "traefik.http.routers.minhafila-soketi.priority=350"
      - "traefik.docker.network=traefik_public"
    networks:
      - traefik_public
      - minhafila_internal

  # ─── Frontend Next.js ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://minhafila.meugarcom.app
    container_name: minhafila_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://minhafila.meugarcom.app
      NEXT_PUBLIC_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      NEXT_PUBLIC_PUSHER_HOST: minhafila.meugarcom.app
      NEXT_PUBLIC_PUSHER_PORT: "443"
      NEXT_PUBLIC_PUSHER_SCHEME: https
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-frontend.rule=(Host(`minha-fila.meugarcom.app`) || Host(`minhafila.meugarcom.app`)) && !PathPrefix(`/api`) && !PathPrefix(`/auth/google`) && !PathPrefix(`/auth/magic-link`) && !PathPrefix(`/sanctum`) && !PathPrefix(`/storage`) && !PathPrefix(`/app`)"
      - "traefik.http.routers.minhafila-frontend.entrypoints=websecure"
      - "traefik.http.routers.minhafila-frontend.tls=true"
      - "traefik.http.routers.minhafila-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.minhafila-frontend.priority=250"
      - "traefik.docker.network=traefik_public"
    networks:
      - traefik_public

  # ─── Swagger UI ────────────────────────────────────────────────────────────
  # Acesso via SSH tunnel: ssh -L 8080:localhost:8080 user@servidor
  # depois abrir http://localhost:8080 localmente
  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: minhafila_swagger
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi:/spec:ro
    networks:
      - minhafila_internal

  # ─── Maintenance page (sobe durante deploy) ───────────────────────────────
  maintenance:
    image: nginx:alpine
    container_name: minhafila_maintenance
    restart: "no"
    profiles: ["maintenance"]
    volumes:
      - ./infra/maintenance:/usr/share/nginx/html:ro
      - ./infra/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minhafila-maintenance.rule=Host(`minha-fila.meugarcom.app`) || Host(`minhafila.meugarcom.app`)"
      - "traefik.http.routers.minhafila-maintenance.entrypoints=websecure"
      - "traefik.http.routers.minhafila-maintenance.tls=true"
      - "traefik.http.routers.minhafila-maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.services.minhafila-maintenance.loadbalancer.server.port=80"
      - "traefik.http.routers.minhafila-maintenance.priority=1000"
