name: CI

# Runner self-hosted (minha-fila-vps): a cota de minutos hosted do GitHub acabou
# e job em ubuntu-latest nem começa. O runner é a VPS de produção, então nada
# de PHP/Node instalado no host — cada passo roda em container descartável.
#
# Três degraus (a suíte completa e o deploy vivem em deploy.yml, só em tag v*):
#   1. Pull request: lint, sintaxe e testes básicos (Unit).
#   2. Merge na main: suíte rápida (build + boot), sem deploy.
#   3. Tag v*: suíte completa + deploy (deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: PHP sintaxe + testes básicos
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f compose.yml build app

      - name: Install dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env e gerar chave
        run: |
          cp backend/.env.example backend/.env
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            php artisan key:generate

      - name: Sintaxe PHP
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            sh -c 'find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'

      - name: Testes básicos (Unit)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            php artisan test --testsuite=Unit

  frontend:
    name: TypeScript Check
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies e type check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend:/app" -w /app \
            node:22-alpine \
            sh -c 'npm install && npx tsc --noEmit'

  composer-audit:
    name: PHP Dependency Audit
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f compose.yml build app

      - name: Install dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            composer install --no-interaction --prefer-dist --no-dev

      - name: Audit dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            composer audit

  npm-audit:
    name: NPM Dependency Audit
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies e audit
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend:/app" -w /app \
            node:22-alpine \
            sh -c 'npm ci && node scripts/npm-audit-ci.mjs'

  # Merge na main: só build + boot, sem testes pesados e sem deploy.
  smoke:
    name: Build + boot (main)
    if: github.event_name == 'push'
    runs-on: [self-hosted, minha-fila-vps]

    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f compose.yml build app

      - name: Install dependencies e boot
        run: |
          cp backend/.env.example backend/.env
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            minha-fila:app \
            sh -c 'composer install --no-interaction --prefer-dist --optimize-autoloader && php artisan key:generate && php artisan about'

      - name: Build frontend
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend:/app" -w /app \
            node:22-alpine \
            sh -c 'npm ci && npm run build'
