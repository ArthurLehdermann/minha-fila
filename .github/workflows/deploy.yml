name: Deploy Minha Fila

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minhafila
          POSTGRES_PASSWORD: minhafila_testing
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, iconv
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env for testing
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=minhafila|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=minhafila_testing|' .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit --testdox
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: minhafila
          DB_PASSWORD: minhafila_testing
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          TELESCOPE_ENABLED: false

  deploy:
    needs: [test]
    runs-on: [self-hosted, minhafila-vps]
    environment: production

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e

          SUDO=""
          if ! docker info >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              SUDO="sudo "
              echo "ℹ️ Usando sudo para comandos Docker"
            else
              echo "❌ Docker indisponível para o usuário do runner: $(whoami)"
              echo "ℹ️ Garanta um destes cenários no host self-hosted:"
              echo "   1) usuário do runner no grupo docker (e serviço reiniciado)"
              echo "   2) sudo sem senha para /usr/bin/docker"
              echo "ℹ️ Debug rápido:"
              id || true
              docker info || true
              if command -v sudo >/dev/null 2>&1; then
                sudo -n docker info || true
              fi
              exit 1
            fi
          fi

          ENV_FILE="${DEPLOY_ENV_FILE:-/root/minhafila-secrets/.env.prod}"
          COMPOSE_ENV_FILE="$ENV_FILE"
          TMP_ENV_FILE=""
          STAT_ERR_FILE="/tmp/minhafila-env-stat-$$.log"

          if [ -r "$ENV_FILE" ]; then
            echo "ℹ️ .env acessível diretamente em: $ENV_FILE"
          elif [ -n "$SUDO" ] && ${SUDO}test -r "$ENV_FILE"; then
            TMP_ENV_FILE="/tmp/minhafila-env-$$.prod"
            echo "ℹ️ .env protegido; copiando via sudo para $TMP_ENV_FILE"
            ${SUDO}cp "$ENV_FILE" "$TMP_ENV_FILE"
            ${SUDO}chown "$(id -u):$(id -g)" "$TMP_ENV_FILE"
            chmod 600 "$TMP_ENV_FILE"
            COMPOSE_ENV_FILE="$TMP_ENV_FILE"
            trap 'rm -f "$TMP_ENV_FILE" "$STAT_ERR_FILE"' EXIT
          else
            STAT_RC=0
            stat "$ENV_FILE" >/dev/null 2>"$STAT_ERR_FILE" || STAT_RC=$?
            if [ -e "$ENV_FILE" ] || ([ -n "$SUDO" ] && ${SUDO}test -e "$ENV_FILE"); then
              echo "❌ .env existe, mas sem permissão de leitura: $ENV_FILE"
              echo "ℹ️ Ajuste permissões/owner do arquivo ou use DEPLOY_ENV_FILE apontando para caminho legível pelo runner."
            elif [ "$STAT_RC" -ne 0 ] && grep -qi "Permission denied" "$STAT_ERR_FILE"; then
              echo "❌ Sem permissão para acessar caminho do .env: $ENV_FILE"
              echo "ℹ️ O arquivo pode existir, mas o usuário $(whoami) não consegue atravessar o diretório (ex.: /root)."
              echo "ℹ️ Recomenda-se mover o segredo para /opt/... com grupo do runner e permissão 640."
            else
              echo "❌ .env não encontrado em: $ENV_FILE"
            fi
            exit 1
          fi

          DC="${SUDO}docker compose -p minha-fila --env-file $COMPOSE_ENV_FILE"

          echo "⏸️ Ativando maintenance..."
          ${SUDO}docker rm -f minhafila_maintenance 2>/dev/null || true
          $DC --profile maintenance up -d maintenance

          CURRENT_PATH="$DEPLOY_PATH"
          BUILD_PATH="/root/minhafila-build"
          BACKUP_PATH="/root/minhafila-backup-$(date +%s)"

          echo "📦 Preparando build..."
          rm -rf "$BUILD_PATH"
          mkdir -p "$BUILD_PATH"

          cp -r . "$BUILD_PATH/"

          echo "🛑 Parando app..."
          $DC stop app 2>/dev/null || true
          $DC rm -f app 2>/dev/null || true
          sleep 2
          sync

          echo "🔄 Swap de diretório..."
          mv "$CURRENT_PATH" "$BACKUP_PATH"
          mv "$BUILD_PATH" "$CURRENT_PATH"
          cd "$CURRENT_PATH"

          echo "♻️ Restaurando .env e storage..."

          # .env vindo do secrets (direto ou da cópia temporária)
          cp "$COMPOSE_ENV_FILE" "$CURRENT_PATH/.env"

          # storage vindo do deploy anterior
          if [ -d "$BACKUP_PATH/storage" ]; then
            rm -rf "$CURRENT_PATH/storage"
            cp -a "$BACKUP_PATH/storage" "$CURRENT_PATH/storage"
          else
            echo "⚠️ storage não encontrado no backup"
          fi

          echo "🚀 Subindo containers..."
          $DC up -d --remove-orphans

          echo "⏳ Aguardando app responder..."
          for i in {1..30}; do
            if $DC exec -T app curl -sf http://localhost/health >/dev/null 2>&1; then
              echo "✓ App respondeu"
              break
            fi
            sleep 2
          done

          echo "🔑 Ajustando permissões..."
          $DC exec -T app sh -c 'chown -R www-data:www-data storage bootstrap/cache || true'
          $DC exec -T app sh -c 'chmod -Rf 775 storage bootstrap/cache'

          ARTISAN="$DC exec -T -e CACHE_DRIVER=file -e SESSION_DRIVER=file -e REDIS_CLIENT=predis app php artisan"

          echo "📦 Dependências..."
          $DC exec -T app composer install --no-dev --optimize-autoloader --no-interaction

          $ARTISAN package:discover --ansi
          $ARTISAN storage:link --force

          echo "📊 Migrations..."
          if ! $ARTISAN migrate --force; then
            echo "❌ Migration falhou — rollback"
            rm -rf "$CURRENT_PATH"
            mv "$BACKUP_PATH" "$CURRENT_PATH"
            cd "$CURRENT_PATH"
            $DC up -d
            exit 1
          fi

          echo "⚡ Otimização..."
          $ARTISAN optimize
          $ARTISAN queue:restart

          echo "🧹 Limpando imagens..."
          ${SUDO}docker image prune -f

          echo "🧹 Limpando backup antigo..."
          rm -rf /tmp/minhafila-*
          mv "$BACKUP_PATH" "/tmp/"

          echo "✅ Removendo maintenance..."
          $DC --profile maintenance stop maintenance 2>/dev/null || true

          echo "✅ Deploy concluído: $(date)"

      - name: Troubleshooting
        if: failure()
        run: |
          echo "❌ Falhou — logs:"
          SUDO=""
          if ! docker info >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              SUDO="sudo "
            fi
          fi
          ENV_FILE="${DEPLOY_ENV_FILE:-/root/minhafila-secrets/.env.prod}"
          STAT_ERR_FILE="/tmp/minhafila-env-stat-trouble-$$.log"
          STAT_RC=0
          stat "$ENV_FILE" >/dev/null 2>"$STAT_ERR_FILE" || STAT_RC=$?
          if [ -r "$ENV_FILE" ] || ([ -n "$SUDO" ] && ${SUDO}test -r "$ENV_FILE"); then
            ${SUDO}docker compose -p minha-fila --env-file "$ENV_FILE" ps || true
            ${SUDO}docker compose -p minha-fila --env-file "$ENV_FILE" logs app | tail -100 || true
          elif [ "$STAT_RC" -ne 0 ] && grep -qi "Permission denied" "$STAT_ERR_FILE"; then
            echo "⚠️ Sem permissão para acessar $ENV_FILE (provável diretório protegido, como /root)."
          else
            echo "⚠️ Não foi possível ler $ENV_FILE para coletar logs do compose."
          fi
          rm -f "$STAT_ERR_FILE" || true
