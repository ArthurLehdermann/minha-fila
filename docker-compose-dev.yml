services:
  # ─── PostgreSQL (Prod: 17) ──────────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: minhafila_db_dev
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-minhafila}
      POSTGRES_USER: ${DB_USERNAME:-minhafila}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minhafila}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-minhafila} -d ${DB_DATABASE:-minhafila}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Prod: 7-alpine) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: minhafila_redis_dev
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Laravel App (Custom local Dockerfile) ────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: minhafila_app_dev
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www
    ports:
      - "8080:80"   # Access via http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Queue worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minhafila_queue_dev
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "[ -f /var/www/vendor/autoload.php ] || composer install --no-interaction --prefer-dist --optimize-autoloader && php /var/www/artisan queue:work --verbose --tries=3 --timeout=600"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.cli
    container_name: minhafila_scheduler_dev
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
    command: sh -c "[ -f /var/www/vendor/autoload.php ] || composer install --no-interaction --prefer-dist --optimize-autoloader; while true; do php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Soketi (Realtime) ─────────────────────────────────────────────────────
  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: minhafila_soketi_dev
    restart: always
    env_file:
      - .env
    environment:
      SOKETI_REDIS_HOST: redis
      SOKETI_REDIS_PORT: 6379
      SOKETI_DEFAULT_APP_NAME: minha-fila
      SOKETI_DEFAULT_APP_ID: "minha-fila"
      SOKETI_DEFAULT_APP_KEY: "minha-fila-key"
      SOKETI_DEFAULT_APP_SECRET: "minha-fila-secret"
      SOKETI_LOG_LEVEL: info
      NODE_OPTIONS: --no-warnings
    depends_on:
      - redis
    ports:
      - "6001:6001"

  # ─── Mailpit (Local Mail Catcher) ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    container_name: minhafila_mailpit_dev
    restart: always
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port

  # ─── Frontend Next.js (Dev Server) ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: minhafila_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_PUSHER_APP_KEY: "minha-fila-key"
      NEXT_PUBLIC_PUSHER_HOST: localhost
      NEXT_PUBLIC_PUSHER_PORT: "6001"
      NEXT_PUBLIC_PUSHER_SCHEME: http
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    depends_on:
      - app
      - soketi

  # ─── Swagger UI ────────────────────────────────────────────────────────────
  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: minhafila_swagger_dev
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi:/spec:ro
    ports:
      - "8081:8080" # Access via http://localhost:8081

volumes:
  pgdata_dev:
  redisdata_dev:
