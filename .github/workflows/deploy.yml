name: Deploy Minha Fila

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, iconv
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Prepare .env for testing
        run: |
          cd backend
          cp .env.example .env
          sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=postgres|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=postgres|' .env
          php artisan key:generate

      - name: Run tests
        run: |
          cd backend
          vendor/bin/phpunit --testdox
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          TELESCOPE_ENABLED: false

  deploy:
    needs: [test]
    runs-on: [self-hosted, minhafila-vps]
    environment: production

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e

          ENV_FILE="/root/minhafila-secrets/.env.prod"
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ .env não encontrado"
            exit 1
          fi

          DC="docker compose -p minha-fila --env-file $ENV_FILE"

          echo "⏸️ Ativando maintenance..."
          docker rm -f minhafila_maintenance 2>/dev/null || true
          $DC --profile maintenance up -d maintenance

          CURRENT_PATH="$DEPLOY_PATH"
          BUILD_PATH="/root/minhafila-build"
          BACKUP_PATH="/root/minhafila-backup-$(date +%s)"

          echo "📦 Preparando build..."
          rm -rf "$BUILD_PATH"
          mkdir -p "$BUILD_PATH"

          cp -r . "$BUILD_PATH/"

          echo "🛑 Parando app..."
          $DC stop app 2>/dev/null || true
          $DC rm -f app 2>/dev/null || true
          sleep 2
          sync

          echo "🔄 Swap de diretório..."
          mv "$CURRENT_PATH" "$BACKUP_PATH"
          mv "$BUILD_PATH" "$CURRENT_PATH"
          cd "$CURRENT_PATH"

          echo "♻️ Restaurando .env e storage..."

          # .env vindo do secrets
          cp /root/minhafila-secrets/.env.prod "$CURRENT_PATH/.env"

          # storage vindo do deploy anterior
          if [ -d "$BACKUP_PATH/storage" ]; then
            rm -rf "$CURRENT_PATH/storage"
            cp -a "$BACKUP_PATH/storage" "$CURRENT_PATH/storage"
          else
            echo "⚠️ storage não encontrado no backup"
          fi

          echo "🚀 Subindo containers..."
          $DC up -d --remove-orphans

          echo "⏳ Aguardando app responder..."
          for i in {1..30}; do
            if $DC exec -T app curl -sf http://localhost/health >/dev/null 2>&1; then
              echo "✓ App respondeu"
              break
            fi
            sleep 2
          done

          echo "🔑 Ajustando permissões..."
          $DC exec -T app sh -c 'chown -R www-data:www-data storage bootstrap/cache || true'
          $DC exec -T app sh -c 'chmod -Rf 775 storage bootstrap/cache'

          ARTISAN="$DC exec -T -e CACHE_DRIVER=file -e SESSION_DRIVER=file -e REDIS_CLIENT=predis app php artisan"

          echo "📦 Dependências..."
          $DC exec -T app composer install --no-dev --optimize-autoloader --no-interaction

          $ARTISAN package:discover --ansi
          $ARTISAN storage:link --force

          echo "📊 Migrations..."
          if ! $ARTISAN migrate --force; then
            echo "❌ Migration falhou — rollback"
            rm -rf "$CURRENT_PATH"
            mv "$BACKUP_PATH" "$CURRENT_PATH"
            cd "$CURRENT_PATH"
            $DC up -d
            exit 1
          fi

          echo "⚡ Otimização..."
          $ARTISAN optimize
          $ARTISAN queue:restart

          echo "🧹 Limpando imagens..."
          docker image prune -f

          echo "🧹 Limpando backup antigo..."
          rm -rf /tmp/minhafila-*
          mv "$BACKUP_PATH" "/tmp/"

          echo "✅ Removendo maintenance..."
          $DC --profile maintenance stop maintenance 2>/dev/null || true

          echo "✅ Deploy concluído: $(date)"

      - name: Troubleshooting
        if: failure()
        run: |
          echo "❌ Falhou — logs:"
          docker compose -p minha-fila ps
          docker compose -p minha-fila logs app | tail -100
